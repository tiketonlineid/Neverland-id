<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neverland Ticketing Ultra</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#f5f6f8;color:#111;padding-bottom:150px}
.banner{height:260px;background:linear-gradient(135deg,#1738b8,#4160ff);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff}
.banner h1{font-size:42px}.banner p{opacity:.9}
.wrap{max-width:950px;margin:auto;padding:20px}
.title{font-size:32px;font-weight:700;margin:20px 0}
.ticket{background:#fff;border-radius:30px;border:1px solid #e4e8ef;box-shadow:0 8px 25px rgba(0,0,0,.05);margin-bottom:22px;position:relative;overflow:hidden}
.ticket:before,.ticket:after{content:'';position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:#f5f6f8;border:1px solid #e4e8ef}
.ticket:before{left:-15px}.ticket:after{right:-15px}
.top,.bottom{padding:24px;display:flex;justify-content:space-between;align-items:center}
.sep{border-top:2px dashed #e8ebf0}
.name{font-size:20px;font-weight:700}
.desc{padding:0 24px 20px;color:#667085;font-size:14px}
.badge{padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700}
.sale{background:#dfe7ff;color:#4160ff}
.sold{background:#ffe4e4;color:#d33}
.price{font-size:28px;font-weight:700}
.pick{background:#4160ff;color:#fff;border:none;padding:14px 20px;border-radius:14px;font-weight:700;cursor:pointer}
.counter{display:none;gap:12px;align-items:center}
.counter button{width:44px;height:44px;border:none;border-radius:12px;background:#4160ff;color:#fff;font-size:24px}
.qty{font-size:22px;font-weight:700}
.footer{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:18px;box-shadow:0 -8px 25px rgba(0,0,0,.08)}
.buy{width:100%;margin-top:10px;border:none;border-radius:16px;padding:18px;background:#4160ff;color:#fff;font-size:20px;font-weight:700}
.small{color:#777}
.row{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="banner">
<div class="NEVERLAND BANDUNG">
    <img src="banner-neverland2.png" alt="banner">
</div>
<div class="title">🎫 Kategori Tiket</div>
<div id="list"></div>
</div>
<div class="footer">
<div class="row">
<div><div class="small" id="qtyText">0 Tiket Dipilih</div><div id="totalText"><b>Rp100.000</b></div></div>
<div><b>Total</b></div>
</div>
<button class="buy" onclick="checkout()">Beli Sekarang</button>
</div>
<script>
const data=[
['PRESALE - FESTIVAL',140000,true,'Akses Festival Area'],
['NORMAL - FESTIVAL',185000,true,'Tiket Festival Reguler'],
['NORMAL - VIP',255000,true,'Akses VIP Area'],
['EARLY BIRD - FESTIVAL',100000,false,'Sold Out'],
['EARLY BIRD - VIP',150000,false,'Sold Out'],
['PRESALE - VIP',200000,false,'Sold Out']
];
let total=0,qty=0,selected={};
const list=document.getElementById('list');
data.forEach((t,i)=>{
list.innerHTML+=`<div class="ticket">
<div class="top"><div class="name">${t[0]}</div><div class="badge ${t[2]?'sale':'sold'}">${t[2]?'ON SALE':'SOLD OUT'}</div></div>
<div class="desc">${t[3]}</div>
<div class="sep"></div>
<div class="bottom">
<div class="price">Rp${t[1].toLocaleString('id-ID')}</div>
${t[2]?`<button class="pick" id="b${i}" onclick="pick(${i},${t[1]})">Pilih Tiket</button>
<div class="counter" id="c${i}"><button onclick="minus(${i},${t[1]})">−</button><span class="qty" id="q${i}">1</span><button onclick="plus(${i},${t[1]})">+</button></div>`:`<button class="pick" disabled>SOLD OUT</button>`}
</div></div>`;
});
function rup(n){return 'Rp'+n.toLocaleString('id-ID')}
function update(){qtyText.innerText=qty+' Tiket Dipilih';totalText.innerHTML='<b>'+(total?rup(total):'Rp100.000')+'</b>'}
function pick(i,p){selected[i]=1;qty++;total+=p;b(i).style.display='none';c(i).style.display='flex';update()}
function plus(i,p){selected[i]++;qty++;total+=p;q(i).innerText=selected[i];update()}
function minus(i,p){if(selected[i]>1){selected[i]--;qty--;total-=p;q(i).innerText=selected[i];update()}}
function b(i){return document.getElementById('b'+i)}
function c(i){return document.getElementById('c'+i)}
function q(i){return document.getElementById('q'+i)}
function checkout(){localStorage.setItem('jumlahTiket',qty);localStorage.setItem('totalPembayaran',total);window.location.href='from.html'}
</script>
</body></html>
